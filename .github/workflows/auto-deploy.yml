name: Auto Deploy on Content Update

on:
  # 囑控内容更新（Supabase 同步后触发）
  workflow_run:
    workflows: ["Auto Sync Articles"]
    types:
      - completed
  # 每天自动检查更新
  schedule:
    - cron: '0 2 * * *'  # 北京时间 10:00
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: Check for new articles
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 检查过去 24 小时是否有新文章
          RESPONSE=$(curl -s "${{ env.SUPABASE_URL }}/rest/v1/articles?select=count&publish_date=gt.$(date -d '24 hours ago' -Iseconds)" \
            -H "apikey: ${{ env.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_ANON_KEY }}")
          
          # Supabase count returns {"count": N} or [{"count": N}] depending on query
          # Handle both formats
          COUNT=$(echo $RESPONSE | jq 'if type == "array" then .[0].count // 0 elif type == "object" then .count // 0 else 0 end')
          
          if [ "$COUNT" -gt "0" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "✅ 发现 $COUNT 篇新文章"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 无新文章"
          fi

  trigger-deploy:
    runs-on: ubuntu-latest
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    steps:
      - name: Trigger Vercel Deploy
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          echo "🚀 已触发 Vercel 部署"
