name: Backup to Remote

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Backup to Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/princealberts-projects
          dst: gitee/princealberts
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: "xiaobo-news-v2"
          force_update: true
      
      - name: Backup Success
        run: |
          echo "✅ 备份完成"
          echo "📦 GitHub → Gitee"
